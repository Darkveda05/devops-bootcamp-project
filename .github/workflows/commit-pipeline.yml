name: Commit Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (ship app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/ship/package-lock.json

      - name: Install dependencies
        working-directory: app/ship
        run: npm ci

      - name: Run preflight test
        working-directory: app/ship
        run: npm test

      - name: Run unit tests
        working-directory: app/ship
        run: npm run test:unit

      - name: Build
        working-directory: app/ship
        run: npm run build
