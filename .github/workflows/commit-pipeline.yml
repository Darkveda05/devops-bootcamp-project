name: CI/CD — Docs Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.MD'
      - 'README.md'
      - 'index.html'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-sync:
    name: Sync README.MD <-> index.html
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync docs
        run: |
          CHANGED=""
          if [ "${{ github.event_name }}" = "push" ]; then
            PREV="${GITHUB_PREVIOUS_SHA:-HEAD~1}"
            if [ "$PREV" = "" ] || [ "$PREV" = "0000000000000000000000000000000000000000" ] || [ "$PREV" = "HEAD~1" ]; then
              CHANGED="README.MD README.md index.html"
            else
              CHANGED="$(git diff --name-only "$PREV"..HEAD -- README.* index.html || true)"
            fi
          else
            CHANGED="README.MD README.md index.html"
          fi
          if [ -z "$CHANGED" ]; then
            echo "No doc changes in this push — sync skipped."
          else
            CHANGED="$CHANGED" node scripts/sync-docs.mjs --write
          fi

      - name: Commit synced docs
        run: |
          if ! git diff --exit-code --quiet -- README.* index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.* index.html
            git commit -m "docs: sync README and index.html"
            git push
            echo "Committed and pushed synced docs."
          else
            echo "Docs already in sync — nothing to commit."
          fi