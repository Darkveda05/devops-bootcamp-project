- name: Tarik imej dari ECR dan jalankan container web di node3
  hosts: node3
  become: true
  vars:
    aws_region: ap-southeast-1
    ecr_registry: 569215999117.dkr.ecr.ap-southeast-1.amazonaws.com
    image_repo: devops-bootcamp/final-project-yusof
    image_tag: latest
    web_port: 80
  tasks:
    - name: Pastikan docker dipasang dan berjalan
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pasang aws cli jika tiada
      become: true
      shell: |
        if ! command -v aws >/dev/null 2>&1; then
          apt-get update -y && apt-get install -y unzip curl
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q -o /tmp/awscliv2.zip -d /tmp/aws-cli
          /tmp/aws-cli/aws/install
        fi
      changed_when: false

    - name: Daftar login ke ECR
      shell: |
        aws ecr get-login-password --region {{ aws_region }} \
          | docker login --username AWS --password-stdin {{ ecr_registry }}
      register: ecr_login
      until: ecr_login.rc == 0
      retries: 6
      delay: 10
      changed_when: false

    - name: Tarik imej dari ECR
      docker_image:
        name: "{{ ecr_registry }}/{{ image_repo }}:{{ image_tag }}"
        source: pull

    - name: Buang semua container lama yang duduk di port {{ web_port }}
      shell: |
        for c in $(docker ps -aq); do
          ports=$(docker port "$c" 2>/dev/null | grep -q "/tcp" && docker port "$c")
          if echo "$ports" | grep -q "0.0.0.0:{{ web_port }}"; then
            docker rm -f "$c"
          fi
        done
      changed_when: false

    - name: Buang container web jika wujud
      docker_container:
        name: web
        state: absent
      ignore_errors: yes

    - name: Jalankan container web pada port {{ web_port }}
      docker_container:
        name: web
        image: "{{ ecr_registry }}/{{ image_repo }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ web_port }}:80"

    - name: Tunjuk status container web
      command: docker ps --filter name=web --format "table {{ '{{.Names}}' }}\t{{ '{{.Status}}' }}\t{{ '{{.Ports}}' }}"
      register: web_status
      changed_when: false

    - name: Papar status
      debug:
        var: web_status.stdout
